<!DOCTYPE html>
<html lang="ko">
<head>
  <script>document.documentElement.classList.add('fonts-loading');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>텍스트 생성기 — 양자리출판사</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/assets/css/common.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    .gen-topbar {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 4mm;
      border-bottom: 1px solid var(--rule);
      font-size: 18px;
      flex-shrink: 0;
      gap: 12px;
    }
    .gen-topbar a { color: inherit; text-decoration: none; }
    .gen-topbar .sep { color: var(--rule); }

    .gen-folder-btn {
      margin-left: auto;
      padding: 6px 14px;
      border: 1px solid var(--rule);
      background: none;
      font-family: var(--ui-font);
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .gen-folder-btn:hover { background: var(--text); color: white; border-color: var(--text); }
    .gen-folder-btn.ready { border-color: var(--text); background: var(--text); color: white; }

    .gen-folder-status {
      font-size: 13px;
      color: var(--rule);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .gen-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      flex: 1;
      min-height: 0;
    }

    .gen-panel {
      padding: 28px;
      overflow-y: auto;
      border-right: 1px solid var(--rule);
    }

    .gen-side {
      padding: 28px;
      overflow-y: auto;
      background: #e8e8e8;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gen-section { margin-bottom: 32px; }

    .gen-section-title {
      font-size: 12px;
      color: var(--rule);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .gen-field { margin-bottom: 12px; }

    .gen-label {
      font-size: 13px;
      color: var(--rule);
      margin-bottom: 4px;
      display: block;
    }

    .gen-input {
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--rule);
      font-family: var(--ui-font);
      font-size: 17px;
      color: var(--text);
      padding: 4px 0;
      outline: none;
      letter-spacing: -0.01em;
    }
    .gen-input:focus { border-bottom-color: var(--text); }

    .gen-textarea {
      width: 100%;
      background: white;
      border: 1px solid var(--rule);
      font-family: var(--ui-font);
      font-size: 15px;
      color: var(--text);
      padding: 10px;
      outline: none;
      letter-spacing: -0.01em;
      resize: vertical;
      min-height: 80px;
      line-height: 1.7;
    }
    .gen-textarea:focus { border-color: var(--text); }
    .gen-textarea.tall { min-height: 120px; max-height: none; field-sizing: content; }

    /* 블록 */
    .gen-blocks { display: flex; flex-direction: column; gap: 10px; }

    .gen-block {
      border: 1px solid var(--rule);
      padding: 14px;
      background: white;
    }

    .gen-block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .gen-block-type {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rule);
      flex: 1;
    }

    .gen-block-actions { display: flex; gap: 4px; }

    .gen-btn-sm {
      background: none;
      border: 1px solid var(--rule);
      cursor: pointer;
      padding: 2px 8px;
      font-family: var(--ui-font);
      font-size: 12px;
      color: var(--text);
    }
    .gen-btn-sm:hover { background: var(--text); color: white; border-color: var(--text); }
    .gen-btn-sm--del:hover { background: #c0392b; border-color: #c0392b; }

    .gen-sizes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }

    .gen-size-btn {
      flex: 1;
      padding: 7px 4px;
      text-align: center;
      border: 1px solid var(--rule);
      cursor: pointer;
      font-family: var(--ui-font);
      font-size: 12px;
      background: none;
      color: var(--rule);
      line-height: 1.3;
    }
    .gen-size-btn.active { background: var(--text); color: white; border-color: var(--text); }

    .gen-size-icon {
      display: block;
      margin: 0 auto 3px auto;
      height: 14px;
      background: currentColor;
      opacity: 0.5;
    }
    .gen-size-btn.active .gen-size-icon { opacity: 1; }

    .gen-add-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

    .gen-add-btn {
      padding: 8px 14px;
      border: 1px dashed var(--rule);
      background: none;
      font-family: var(--ui-font);
      font-size: 14px;
      color: var(--rule);
      cursor: pointer;
    }
    .gen-add-btn:hover { border-color: var(--text); color: var(--text); background: white; }

    /* 출력 패널 */
    .gen-save-btn {
      width: 100%;
      padding: 13px;
      background: var(--text);
      color: white;
      border: none;
      font-family: var(--ui-font);
      font-size: 17px;
      cursor: pointer;
      letter-spacing: -0.01em;
    }
    .gen-save-btn:hover { opacity: 0.75; }
    .gen-save-btn:disabled { opacity: 0.35; cursor: default; }

    .gen-generate-btn {
      width: 100%;
      padding: 10px;
      background: none;
      border: 1px solid var(--text);
      font-family: var(--ui-font);
      font-size: 15px;
      cursor: pointer;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .gen-generate-btn:hover { background: var(--text); color: white; }

    .gen-copy-btn {
      width: 100%;
      padding: 10px;
      background: none;
      border: 1px solid var(--rule);
      font-family: var(--ui-font);
      font-size: 14px;
      cursor: pointer;
      color: var(--rule);
      letter-spacing: -0.01em;
    }
    .gen-copy-btn:hover { background: var(--rule); color: white; }

    .gen-log {
      font-size: 13px;
      line-height: 1.8;
      color: var(--rule);
      padding: 10px;
      background: #d8d8d8;
      min-height: 60px;
    }
    .gen-log .ok { color: #2d7a2d; }
    .gen-log .err { color: #c0392b; }

    .gen-code {
      flex: 1;
      min-height: 200px;
      width: 100%;
      background: #1c1c1c;
      color: #d4d4d4;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 11.5px;
      padding: 12px;
      resize: none;
      outline: none;
      line-height: 1.55;
    }

    .gen-img-row { display: flex; gap: 6px; align-items: center; }
    .gen-img-row .gen-input { flex: 1; }

    .gen-browse-btn {
      flex-shrink: 0;
      padding: 4px 10px;
      background: none;
      border: 1px solid var(--rule);
      font-family: var(--ui-font);
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
    }
    .gen-browse-btn:hover { background: var(--text); color: white; border-color: var(--text); }

    .gen-img-preview {
      width: 80px;
      height: 54px;
      object-fit: cover;
      display: none;
      margin-top: 8px;
    }

    .gen-pair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .gen-divider { border: none; border-top: 1px solid var(--rule); margin: 0; }
  </style>
</head>
<body>

  <div class="gen-topbar">
    <a href="/">양자리출판사</a>
    <span class="sep">/</span>
    <span>텍스트 생성기</span>
    <span class="gen-folder-status" id="folder-status">폴더 미선택</span>
    <button class="gen-folder-btn" style="margin-left:auto;" onclick="loadPost()">불러오기</button>
    <button class="gen-folder-btn" id="folder-btn" style="margin-left:0;" onclick="selectFolder()">프로젝트 폴더 선택</button>
  </div>

  <div class="gen-layout">

    <!-- 빌더 -->
    <div class="gen-panel">

      <div class="gen-section">
        <div class="gen-section-title">메타데이터</div>
        <div class="gen-field">
          <label class="gen-label">저자 (회색으로 표시, 선택)</label>
          <input class="gen-input" id="meta-author" type="text" placeholder="앙토냉 아르토" />
        </div>
        <div class="gen-field">
          <label class="gen-label">제목</label>
          <input class="gen-input" id="meta-title" type="text" placeholder="잔혹 연극이란 무엇인가" />
        </div>
        <div class="gen-field">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <span class="gen-label" style="margin-bottom:0;">메타 항목</span>
            <div style="display:flex;gap:6px;">
              <button class="gen-btn-sm" onclick="addMetaRow()">+ 항목</button>
              <button class="gen-btn-sm" onclick="addMetaDivider()">+ 점선</button>
            </div>
          </div>
          <div id="meta-rows-container"></div>
        </div>
        <div class="gen-field">
          <label class="gen-label">파일명 (text/ 폴더에 저장)</label>
          <input class="gen-input" id="meta-filename" type="text" placeholder="text_03.html" />
        </div>
      </div>

      <div class="gen-section">
        <div class="gen-section-title">목록 카드 (text/index.html · index.html 자동 업데이트)</div>
        <div class="gen-field">
          <label class="gen-label">썸네일 이미지 (루트 기준 경로)</label>
          <div class="gen-img-row">
            <input class="gen-input" id="card-img" type="text" placeholder="images/text/text_03/thumb.webp" />
            <button class="gen-browse-btn" onclick="pickImage('card-img', 'card-img-preview', true)">찾아보기</button>
          </div>
          <img class="gen-img-preview" id="card-img-preview" />
        </div>
        <div class="gen-field">
          <label class="gen-label">카드 저자 (비워두면 본문 저자 사용)</label>
          <input class="gen-input" id="card-author" type="text" placeholder="본문 저자와 다를 때만 입력" />
        </div>
        <div class="gen-field">
          <label class="gen-label">카드 제목 (비워두면 본문 제목 사용)</label>
          <input class="gen-input" id="card-title" type="text" placeholder="본문 제목과 다를 때만 입력" />
        </div>
        <div class="gen-field">
          <label class="gen-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="card-show-author" checked style="width:auto;margin:0;" />
            카드에 저자명 표시
          </label>
        </div>
        <div class="gen-field">
          <label class="gen-label">카드 날짜 (비워두면 업로드 항목 사용)</label>
          <input class="gen-input" id="card-date" type="text" placeholder="2026년 3월 28일" />
        </div>
        <div class="gen-field">
          <label class="gen-label">한 줄 설명</label>
          <textarea class="gen-textarea" id="card-desc" placeholder="아르토는 언어 중심의 연극을 거부하고, 몸과 공간과 소리가 동시에 작동하는 새로운 연극을 상상했다."></textarea>
        </div>
      </div>

      <div class="gen-section">
        <div class="gen-section-title">배너 이미지 (선택, 제목 위)</div>
        <div class="gen-sizes" id="banner-sizes">
          <button class="gen-size-btn" data-size="xnarrow" onclick="setBannerSize('xnarrow')">
            <span class="gen-size-icon" style="width:12%;"></span>더 좁게
          </button>
          <button class="gen-size-btn" data-size="narrow" onclick="setBannerSize('narrow')">
            <span class="gen-size-icon" style="width:20%;"></span>좁게
          </button>
          <button class="gen-size-btn active" data-size="column" onclick="setBannerSize('column')">
            <span class="gen-size-icon" style="width:35%;"></span>본문폭
          </button>
          <button class="gen-size-btn" data-size="medium" onclick="setBannerSize('medium')">
            <span class="gen-size-icon" style="width:50%;"></span>중간
          </button>
          <button class="gen-size-btn" data-size="wide" onclick="setBannerSize('wide')">
            <span class="gen-size-icon" style="width:65%;"></span>넓게
          </button>
          <button class="gen-size-btn" data-size="wider" onclick="setBannerSize('wider')">
            <span class="gen-size-icon" style="width:82%;"></span>더넓게
          </button>
          <button class="gen-size-btn" data-size="full" onclick="setBannerSize('full')">
            <span class="gen-size-icon" style="width:100%;"></span>전체폭
          </button>
        </div>
        <div class="gen-field">
          <label class="gen-label">이미지 (post 기준 경로)</label>
          <div class="gen-img-row">
            <input class="gen-input" id="banner-src" type="text" placeholder="../images/text/text_03/banner.webp" />
            <button class="gen-browse-btn" onclick="pickImage('banner-src', 'banner-preview', false)">찾아보기</button>
          </div>
          <img class="gen-img-preview" id="banner-preview" />
        </div>
        <div class="gen-field">
          <label class="gen-label">alt 텍스트</label>
          <input class="gen-input" id="banner-alt" type="text" placeholder="" />
        </div>
      </div>

      <div class="gen-section">
        <div class="gen-section-title" style="margin-top:16px;">각주</div>
        <div id="footnotes-container"></div>
        <div class="gen-add-btns">
          <button class="gen-add-btn" onclick="addFootnote()">+ 각주 추가</button>
        </div>
        <div class="gen-section-title">본문 블록</div>
        <div class="gen-blocks" id="blocks-container"></div>
        <div class="gen-add-btns">
          <button class="gen-add-btn" onclick="addBlock('text')">+ 텍스트</button>
          <button class="gen-add-btn" onclick="addBlock('heading')">+ 소제목 (GothicA1)</button>
          <button class="gen-add-btn" onclick="addBlock('image')">+ 이미지</button>
          <button class="gen-add-btn" onclick="addBlock('pair')">+ 이미지 둘</button>
        </div>
      </div>

    </div>

    <!-- 출력 -->
    <div class="gen-side">
      <button class="gen-save-btn" id="save-btn" onclick="saveAll()">저장하기</button>
      <button class="gen-save-btn" style="background:#c0392b;" onclick="deletePost()">카드 삭제</button>
      <hr class="gen-divider">
      <button class="gen-generate-btn" onclick="previewGenerate()">HTML만 미리보기</button>
      <button class="gen-copy-btn" id="copy-btn" onclick="copyCode()">복사</button>
      <div class="gen-log" id="gen-log">폴더를 선택하면 저장하기 버튼으로<br>파일이 자동 생성·업데이트됩니다.</div>
      <textarea class="gen-code" id="output-code" readonly placeholder="'HTML만 미리보기' 버튼을 누르면 여기에 코드가 나옵니다."></textarea>
    </div>

  </div>

  <script>
    let blocks = [];
    let nextId = 0;
    let dirHandle = null;
    let bannerSize = 'column';
    let metaRows = [];
    let metaRowId = 0;

    function addMetaRow(key = '', value = '') {
      metaRows.push({ id: metaRowId++, type: 'row', key, value });
      renderMetaRows();
    }

    function addMetaDivider() {
      metaRows.push({ id: metaRowId++, type: 'divider' });
      renderMetaRows();
    }

    function removeMetaRow(id) {
      metaRows = metaRows.filter(r => r.id !== id);
      renderMetaRows();
    }

    function moveMetaRow(id, dir) {
      const idx = metaRows.findIndex(r => r.id === id);
      const next = idx + dir;
      if (idx < 0 || next < 0 || next >= metaRows.length) return;
      [metaRows[idx], metaRows[next]] = [metaRows[next], metaRows[idx]];
      renderMetaRows();
    }

    function syncMeta(id, field, el) {
      const r = metaRows.find(r => r.id === id);
      if (r) r[field] = el.value;
    }

    function renderMetaRows() {
      const c = document.getElementById('meta-rows-container');
      c.innerHTML = metaRows.map(r => {
        if (r.type === 'divider') {
          return `
        <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center;">
          <div style="flex:1;border-top:1px dashed var(--rule);"></div>
          <button class="gen-btn-sm" style="flex-shrink:0;" onclick="moveMetaRow(${r.id},-1)">↑</button>
          <button class="gen-btn-sm" style="flex-shrink:0;" onclick="moveMetaRow(${r.id},1)">↓</button>
          <button class="gen-btn-sm gen-btn-sm--del" style="flex-shrink:0;" onclick="removeMetaRow(${r.id})">삭제</button>
        </div>`;
        }
        return `
        <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center;">
          <input class="gen-input" style="width:80px;flex-shrink:0;" value="${esc(r.key)}" placeholder="항목명"
            oninput="syncMeta(${r.id},'key',this)" />
          <input class="gen-input" style="flex:1;" value="${esc(r.value)}" placeholder="내용"
            oninput="syncMeta(${r.id},'value',this)" />
          <button class="gen-btn-sm" style="flex-shrink:0;" onclick="moveMetaRow(${r.id},-1)">↑</button>
          <button class="gen-btn-sm" style="flex-shrink:0;" onclick="moveMetaRow(${r.id},1)">↓</button>
          <button class="gen-btn-sm gen-btn-sm--del" style="flex-shrink:0;" onclick="removeMetaRow(${r.id})">삭제</button>
        </div>`;
      }).join('');
    }

    const IMG_SIZES = [
      { key: 'xnarrow', label: '더 좁게', w: '12%' },
      { key: 'narrow', label: '좁게',   w: '20%' },
      { key: 'column', label: '본문폭', w: '35%' },
      { key: 'medium', label: '중간',   w: '50%' },
      { key: 'wide',   label: '넓게',   w: '65%' },
      { key: 'wider',  label: '더넓게', w: '82%' },
      { key: 'full',   label: '전체폭', w: '100%' },
    ];

    function setBannerSize(size) {
      bannerSize = size;
      document.querySelectorAll('#banner-sizes .gen-size-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.size === size);
      });
    }

    // ── 폴더 선택 ──
    async function selectFolder() {
      try {
        dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        document.getElementById('folder-status').textContent = dirHandle.name;
        document.getElementById('folder-btn').classList.add('ready');
        document.getElementById('folder-btn').textContent = '폴더 변경';
        log('📁 ' + dirHandle.name + ' 폴더 선택됨');
      } catch (e) {
        if (e.name !== 'AbortError') log('<span class="err">폴더 선택 실패: ' + e.message + '</span>');
      }
    }

    // ── 삭제하기 ──
    async function deletePost() {
      if (!dirHandle) { log('<span class="err">먼저 프로젝트 폴더를 선택해주세요.</span>'); return; }
      const filename = v('meta-filename');
      if (!filename) { log('<span class="err">파일명을 입력해주세요.</span>'); return; }
      if (!confirm(filename + ' 카드를 text-data.js에서 삭제할까요?')) return;

      log('삭제 중...');
      try {
        // text-data.js에서 해당 항목 제거
        const fh = await (await dirHandle.getDirectoryHandle('data', { create: true })).getFileHandle('text-data.js');
        const file = await fh.getFile();
        const content = await file.text();
        const match = content.match(/const TEXT_POSTS\s*=\s*\[([\s\S]*?)\];/);
        let posts = [];
        if (match) {
          try { posts = eval('[' + match[1] + ']'); } catch(e) { posts = []; }
        }
        const href = '/text/' + slugFromFilename(filename) + '/';
        posts = posts.filter(p => p.href !== href);
        const postsStr = posts.map(p =>
          `  {\n    href:       "${p.href}",\n    img:        "${p.img}",\n    alt:        "${(p.alt||'').replace(/"/g,'\\"')}",\n    title:      "${(p.title||'').replace(/"/g,'\\"')}",\n    translator: ${p.translator ? '"' + p.translator.replace(/"/g,'\\"') + '"' : 'null'},\n    date:       "${(p.date||'').replace(/"/g,'\\"')}",\n    desc:       "${(p.desc||'').replace(/"/g,'\\"')}"\n  }`
        ).join(',\n');
        const newContent = content.replace(
          /const TEXT_POSTS\s*=\s*\[[\s\S]*?\];/,
          `const TEXT_POSTS = [\n${postsStr}\n];`
        );
        const w = await fh.createWritable();
        await w.write(newContent);
        await w.close();
        log('<span class="ok">✓ text-data.js 카드 삭제됨</span>');

        // 포스트 파일도 삭제
        try {
          const textDir = await dirHandle.getDirectoryHandle('text');
          const slug = slugFromFilename(filename);
          await textDir.removeEntry(slug, { recursive: true });
          log('<span class="ok">✓ text/' + slug + '/index.html 파일 삭제됨 🎉</span>');
        } catch(e) {
          log('<span class="ok">✓ 카드 삭제됨 (파일은 수동으로 삭제해주세요)</span>');

      } catch(e) {
        log('<span class="err">오류: ' + e.message + '</span>');

    // ── 저장하기 ──
    async function saveAll() {
      if (!dirHandle) {
        log('<span class="err">먼저 프로젝트 폴더를 선택해주세요.</span>');
        return;
      }
      const filename = v('meta-filename');
      if (!filename) { log('<span class="err">파일명을 입력해주세요.</span>'); return; }
      if (!v('meta-title')) { log('<span class="err">제목을 입력해주세요.</span>'); return; }

      log('저장 중...');
      try {
        // 1. 포스트 파일 저장
        const slug = slugFromFilename(filename);
        const postHtml = generatePostHTML().replace(/__CLOSE_SCRIPT__/g, '<' + '/script>');
        const textDir = await dirHandle.getDirectoryHandle('text', { create: true });
        const postDir = await textDir.getDirectoryHandle(slug, { create: true });
        await writeFile(postDir, 'index.html', postHtml);
        log('<span class="ok">✓ text/' + slug + '/index.html 저장됨</span>');

        // 2. text-data.js 업데이트
        await updateTextDataJS();
        log('<span class="ok">✓ text-data.js 업데이트됨 (text/index.html · index.html 자동 반영)</span>');

        log('<span class="ok">🎉 완료!</span>');
      } catch (e) {
        log('<span class="err">오류: ' + e.message + '</span>');
        console.error(e);
      }
    }

    async function writeFile(dirHandle, filename, content) {
      const fh = await dirHandle.getFileHandle(filename, { create: true });
      const w = await fh.createWritable();
      await w.write(content);
      await w.close();
    }

    async function updateTextDataJS() {
      const fh = await (await dirHandle.getDirectoryHandle('data', { create: true })).getFileHandle('text-data.js');
      const file = await fh.getFile();
      const content = await file.text();

      const filename = v('meta-filename');
      const title    = v('card-title') || v('meta-title');
      const author   = v('card-author') || v('meta-author');
      const showAuthor = document.getElementById('card-show-author').checked;
      const transRowMeta = metaRows.find(r => r.key === '번역');
      const trans    = transRowMeta ? transRowMeta.value : '';
      const dateRowMeta  = metaRows.find(r => r.key === '업로드');
      const date     = v('card-date') || (dateRowMeta ? dateRowMeta.value : '');
      const img      = v('card-img');
      const desc     = v('card-desc');
      const href     = '/text/' + slugFromFilename(filename) + '/';

      // 기존 TEXT_POSTS 배열 파싱
      const match = content.match(/const TEXT_POSTS\s*=\s*\[([\s\S]*?)\];/);
      let posts = [];
      if (match) {
        try { posts = eval('[' + match[1] + ']'); } catch(e) { posts = []; }
      }

      // 같은 href 있으면 교체, 없으면 맨 앞에 추가
      const newPost = { href, img, alt: title, title, author: showAuthor ? author : null, translator: trans ? trans + ' 번역' : null, date, desc };
      const existing = posts.findIndex(p => p.href === href);
      if (existing >= 0) posts[existing] = newPost;
      else posts.unshift(newPost);

      const postsStr = posts.map(p =>
        `  {\n    href:       "${p.href}",\n    img:        "${p.img}",\n    alt:        "${(p.alt||'').replace(/"/g,'\\"')}",\n    title:      "${(p.title||'').replace(/"/g,'\\"')}",\n    author:     ${p.author ? '"' + p.author.replace(/"/g,'\\"') + '"' : 'null'},\n    translator: ${p.translator ? '"' + p.translator.replace(/"/g,'\\"') + '"' : 'null'},\n    date:       "${(p.date||'').replace(/"/g,'\\"')}",\n    desc:       "${(p.desc||'').replace(/"/g,'\\"')}"\n  }`
      ).join(',\n');

      const newContent = content.replace(
        /const TEXT_POSTS\s*=\s*\[[\s\S]*?\];/,
        `const TEXT_POSTS = [\n${postsStr}\n];`
      );

      const w = await fh.createWritable();
      await w.write(newContent);
      await w.close();
    }

    function generateCardHTML() {
      const filename = v('meta-filename');
      const title    = v('card-title') || v('meta-title');
      const author   = v('card-author') !== undefined && v('card-author') !== '' ? v('card-author') : v('meta-author');
      const transRowMeta = metaRows.find(r => r.key === '번역');
      const trans    = transRowMeta ? transRowMeta.value : '';
      const dateRowMeta  = metaRows.find(r => r.key === '업로드');

    function sourceFilenameFromDoc(doc, fallback) {
      const meta = doc.querySelector('meta[name="source-filename"]');

    function toPreviewURL(path) {
      const value = (path || '').trim();
      if (!value) return '';
      if (/^(blob:|data:|https?:|file:)/i.test(value)) return value;
      if (value.startsWith('/') || value.startsWith('../') || value.startsWith('./')) return value;
      if (value.startsWith('images/')) return '../' + value;
      return value;
    }
    function syncPreviewFromInput(inputId, previewId) {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);

      preview.src = url;
      preview.style.display = url ? 'block' : 'none';

        : type === 'image' ? { src: '', alt: '', caption: '', size: 'column', preview: '' }

    function moveBlock(id, dir) {
      const i = blocks.findIndex(b => b.id === id);
      const j = i + dir;
      if (j < 0 || j >= blocks.length) return;
      [blocks[i], blocks[j]] = [blocks[j], blocks[i]];

    async function copyImageToProject(file, isRoot) {
      if (!dirHandle) return null;
      const slug = v('meta-filename').replace(/\.html$/i, '') || 'post';
      try {
        const imagesDir = await dirHandle.getDirectoryHandle('images', { create: true });
        const textDir = await imagesDir.getDirectoryHandle('text', { create: true });
        const postDir = await textDir.getDirectoryHandle(slug, { create: true });
        const fh = await postDir.getFileHandle(file.name, { create: true });
        const w = await fh.createWritable();
        await w.write(await file.arrayBuffer());
        await w.close();
        const path = isRoot ? `images/text/${slug}/${file.name}` : `../images/text/${slug}/${file.name}`;
        log('이미지 복사됨: ' + path);
        return path;
      } catch (e) {
        log('<span class="err">이미지 복사 실패: ' + e.message + '</span>');
        console.error('Image copy failed:', e);
        return null;
      }

    // isRoot: true = index.html 기준 경로 (썸네일), false = text/ 기준 경로 (배너·본문)
    function pickImage(inputId, previewId, isRoot, blockId, dataKey, previewKey) {
      _cb = async (file) => {
        const prev = document.getElementById(previewId);
        const url = URL.createObjectURL(file);
        if (prev) { prev.src = url; prev.style.display = 'block'; }

        const input = document.getElementById(inputId);
        if (input) {
          if (dirHandle) {
            const path = await copyImageToProject(file, isRoot);
            if (path) { input.value = path; input.dispatchEvent(new Event('input')); }
          } else {
            log('<span class="err">⚠ 폴더가 선택되지 않아 경로를 자동 설정할 수 없습니다. 상단 "프로젝트 폴더 선택"을 먼저 눌러주세요.</span>');
          }
        }

        if (blockId !== undefined) {
          const b = blocks.find(b => b.id === blockId);
          if (b) {
            if (dataKey && input) b.data[dataKey] = input.value;
            if (previewKey) b.data[previewKey] = url;
          }
        }
      };
      _fi.click();
    }

    function renumberFootnotes() {
      footnotes.forEach((f, i) => { f.n = i + 1; });
    }

    function addFootnote(text = '') {
      footnotes.push({ n: footnotes.length + 1, text });
      renderFootnotes();
    }

    function removeFootnote(n) {
      footnotes = footnotes.filter(f => f.n !== n);
      renumberFootnotes();
      renderFootnotes();
    }

    function renderFootnotes() {
      const container = document.getElementById('footnotes-container');
      container.innerHTML = '';
      footnotes.forEach(f => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;';
        row.innerHTML =
          '<span style="font-size:13px;color:var(--rule);padding-top:6px;min-width:16px;">' + f.n + '</span>' +
          '<textarea style="flex:1;min-height:60px;font-size:13px;resize:vertical;" placeholder="각주 내용" oninput="updateFootnote(' + f.n + ', this.value)">' + (f.text||'') + '</textarea>' +
          '<button onclick="removeFootnote(' + f.n + ')" style="background:none;border:none;cursor:pointer;color:#c0392b;font-size:16px;padding:4px;">✕</button>';
        container.appendChild(row);
      });
    }

    function updateFootnote(n, text) {
      const f = footnotes.find(f => f.n === n);
      if (f) f.text = text;
    }

    function footnoteNumberFromAnchor(anchor, fallback) {
      const idMatch = (anchor.getAttribute('id') || '').match(/^fnref-(\d+)$/);
      if (idMatch) return parseInt(idMatch[1], 10);
      const hrefMatch = (anchor.getAttribute('href') || '').match(/^#fn-(\d+)$/);
      if (hrefMatch) return parseInt(hrefMatch[1], 10);
      const textMatch = (anchor.textContent || '').match(/\d+/);
      if (textMatch) return parseInt(textMatch[0], 10);
      return fallback;
    }

    function normalizeFootnoteReferenceHTML(html) {
      if (!html || !/<\s*(sup|a)\b/i.test(html)) return html || '';
      const template = document.createElement('template');
      template.innerHTML = html;
      let fallback = 1;
      const anchors = Array.from(template.content.querySelectorAll('sup a, a[id^="fnref-"], a[href^="#fn-"]'));
      anchors.forEach(anchor => {
        const n = footnoteNumberFromAnchor(anchor, fallback);
        fallback = Math.max(fallback + 1, n + 1);
        anchor.id = `fnref-${n}`;
        anchor.href = `#fn-${n}`;
        anchor.textContent = String(n);
      });
      return template.innerHTML;
    }

    .fn-back { color: var(--rule); text-decoration: none; font-family: var(--ui-font); font-size: 13px; margin-left: 4px; }

        `      <li><span class="fn-num-inline"><a href="#fnref-${f.n}" id="fn-${f.n}">${f.n}</a></span>${f.text}<a class="fn-back" href="#fnref-${f.n}">↩</a></li>`

      return `\n  <div class="post-footnotes">\n    <hr class="post-footnotes-hr">\n    <ul class="post-footnotes-list">\n${items}\n    </ul>\n    <hr class="post-footnotes-hr" style="margin-top: 7mm;">\n  </div>`;

    // ── 불러오기 ──
    async function loadPost() {
      let file;
      try {
        const [fh] = await window.showOpenFilePicker({
          types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
        });
        file = await fh.getFile();
      } catch(e) {
        if (e.name !== 'AbortError') log('<span class="err">불러오기 실패: ' + e.message + '</span>');
        return;
      }

      const html = await file.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');

      // 파일명
      const sourceFilename = sourceFilenameFromDoc(doc, file.name === 'index.html' ? '' : file.name) || file.name;
      document.getElementById('meta-filename').value = sourceFilename;

      // 제목 & 저자
      const titleEl = doc.querySelector('.post-title');
      if (titleEl) {
        const authorSpan = titleEl.querySelector('span[style*="color"]');
        if (authorSpan) {
          document.getElementById('meta-author').value = authorSpan.textContent.trim();
          // <br> 뒤 텍스트 노드
          const nodes = Array.from(titleEl.childNodes);
          const brIdx = nodes.findIndex(n => n.nodeName === 'BR');
          const titleText = nodes.slice(brIdx + 1).map(n => n.textContent).join('').trim();
          document.getElementById('meta-title').value = titleText;
        } else {
          document.getElementById('meta-author').value = '';
          document.getElementById('meta-title').value = titleEl.textContent.trim();
        }
      }

      // 메타 항목: dt/dd 쌍, 점선 div, 항목명 없는 단독 dd를 저장된 순서대로 복원
      metaRows = [];
      metaRowId = 0;
      const dl = doc.querySelector('.post-meta');
      if (dl) {
        const children = Array.from(dl.children);
        for (let i = 0; i < children.length; i++) {
          const child = children[i];
          if (child.tagName === 'DT') {
            const dd = children[i + 1];
            if (dd && dd.tagName === 'DD') {
              metaRows.push({ id: metaRowId++, type: 'row', key: child.textContent.trim(), value: dd.textContent.trim() });
              i++;
            } else {
              metaRows.push({ id: metaRowId++, type: 'row', key: child.textContent.trim(), value: '' });
            }
          } else if (child.tagName === 'DD') {
            metaRows.push({ id: metaRowId++, type: 'row', key: '', value: child.textContent.trim() });
          } else if (child.tagName === 'DIV') {
            metaRows.push({ id: metaRowId++, type: 'divider' });
          }
        }
      }
      if (!metaRows.length) {
        metaRows.push({ id: metaRowId++, type: 'row', key: '번역', value: '' });
        metaRows.push({ id: metaRowId++, type: 'row', key: '업로드', value: '' });
      }
      renderMetaRows();

      // 배너
      document.getElementById('banner-src').value = '';
      document.getElementById('banner-alt').value = '';
      document.getElementById('banner-preview').style.display = 'none';
      bannerSize = 'full';
      const bannerEl = doc.querySelector('.post-banner');
      if (bannerEl) {
        const img = bannerEl.querySelector('img');
        if (img) {
          document.getElementById('banner-src').value = img.getAttribute('src') || '';
          document.getElementById('banner-alt').value = img.getAttribute('alt') || '';
        }
        const m = bannerEl.className.match(/post-banner--(xnarrow|narrow|column|medium|wide|wider|full)/);
        setBannerSize(m ? m[1] : 'column');
      }

      // 배너 미리보기
      syncPreviewFromInput('banner-src', 'banner-preview');

      // 배너 size (모든 크기 포함)
      const bannerElFix = doc.querySelector('.post-banner');
      if (bannerElFix) {
        const mFix = bannerElFix.className.match(/post-banner--(xnarrow|narrow|column|medium|wide|wider|full)/);
        setBannerSize(mFix ? mFix[1] : 'column');
      }

      // 카드 썸네일, 저자, 제목, 날짜, 설명 초기화
      document.getElementById('card-img').value = '';
      document.getElementById('card-img-preview').style.display = 'none';
      document.getElementById('card-author').value = '';
      document.getElementById('card-title').value = '';
      document.getElementById('card-date').value = '';

      const descMeta = doc.querySelector('meta[name="description"]');
      let descContent = descMeta ? (descMeta.content || '') : '';

      // text-data.js에서 카드 정보 복원
      if (dirHandle) {
        try {
          const tfh = await (await dirHandle.getDirectoryHandle('data', { create: true })).getFileHandle('text-data.js');
          const tf  = await tfh.getFile();
          const tc  = await tf.text();
          const match = tc.match(/const TEXT_POSTS\s*=\s*\[([\s\S]*?)\];/);
          if (match) {
            let posts = [];
            try { posts = eval('[' + match[1] + ']'); } catch(e) {}
            const href = '/text/' + slugFromFilename(sourceFilename) + '/';
            const post = posts.find(p => p.href === href);
            if (post) {
              if (post.img) {
                document.getElementById('card-img').value = post.img;
                document.getElementById('card-img-preview').src = toPreviewURL(post.img);
                document.getElementById('card-img-preview').style.display = 'block';
              }
              const postAuthor = document.getElementById('meta-author').value.trim();
              const postTitle  = document.getElementById('meta-title').value.trim();
              if (post.author && post.author !== postAuthor) document.getElementById('card-author').value = post.author;
              if (post.title && post.title !== postTitle)   document.getElementById('card-title').value  = post.title;
              if (post.date) document.getElementById('card-date').value = post.date;
              if (post.desc) descContent = post.desc;
            }
          }
        } catch(e) {}
      }
      document.getElementById('card-desc').value = descContent;
      syncPreviewFromInput('card-img', 'card-img-preview');

      // 카드 저자명 표시 여부 복원
      const showAuthorMeta = doc.querySelector('meta[name="x-card-show-author"]');
      if (showAuthorMeta) {
        document.getElementById('card-show-author').checked = showAuthorMeta.content !== 'false';
      }

      // 본문 블록 파싱
      blocks = [];
      nextId = 0;
      const postWrap = doc.querySelector('.post-wrap');
      if (postWrap) {
        for (const el of Array.from(postWrap.children)) {
          // 헤더 영역 (post-content with h1/dl) 건너뜀
          if (el.classList.contains('post-spacer-label')) continue;
          if (el.classList.contains('post-banner')) continue;
          if (el.classList.contains('post-content') && !el.querySelector('.post-body')) continue;

          if (el.classList.contains('post-content') && el.querySelector('.post-body')) {
            const ps = Array.from(el.querySelectorAll('.post-body p'));
            const textParas = [];
            ps.forEach(p => {
              const style = p.getAttribute('style') || '';
              const isHeading = style.includes('ui-font') || style.includes('GothicA1');
              if (isHeading) {
                // 쌓인 텍스트 문단 먼저 하나의 블록으로
                if (textParas.length) {
                  blocks.push({ id: nextId++, type: 'text', data: { text: textParas.join('\n\n') } });
                  textParas.length = 0;
                }
                const plMatch = style.match(/padding-left:\s*([\d.]+)px/);
                blocks.push({ id: nextId++, type: 'heading', data: { text: p.textContent.trim(), indent: plMatch ? plMatch[1] : '' } });
              } else {
                const normalized = normalizeFootnoteReferenceHTML(p.innerHTML.trim());
                const text = normalized.replace(/<br\s*\/?>/gi, '\n');
                if (text) textParas.push(text);
              }
            });
            // 남은 텍스트 문단 하나의 블록으로
            if (textParas.length) {
              blocks.push({ id: nextId++, type: 'text', data: { text: textParas.join('\n\n') } });
            }

          } else if (el.tagName === 'FIGURE' && el.classList.contains('post-img-wrap')) {
            const img = el.querySelector('img');
            const cap = el.querySelector('figcaption');
            const m = el.className.match(/post-img-wrap--(xnarrow|narrow|column|medium|wide|wider|full)/);
            blocks.push({ id: nextId++, type: 'image', data: {
              src: img ? (img.getAttribute('src') || '') : '',
              alt: img ? (img.getAttribute('alt') || '') : '',
              caption: cap ? cap.textContent.trim() : '',
              size: m ? m[1] : 'column',
              preview: toPreviewURL(img ? (img.getAttribute('src') || '') : '')
            }});

          } else if (el.classList.contains('post-img-pair')) {
            const figs = el.querySelectorAll('figure');
            const m = el.className.match(/post-img-pair--(xnarrow|narrow|column|medium|wide|wider|full)/);
            const g = (fig, n) => {
              const i = fig ? fig.querySelector('img') : null;
              const c = fig ? fig.querySelector('figcaption') : null;
              const src = i ? (i.getAttribute('src') || '') : '';
              return { ['src'+n]: src, ['alt'+n]: i?(i.getAttribute('alt')||''):'', ['cap'+n]: c?c.textContent.trim():'', ['preview'+n]: toPreviewURL(src) };
            };
            blocks.push({ id: nextId++, type: 'pair', data: {
              ...g(figs[0],'1'), ...g(figs[1],'2'),
              size: m ? m[1] : 'full'
            }});
          }
        }
      }


      // 각주 파싱
      footnotes = [];
      const fnList = doc.querySelectorAll('.post-footnotes-list li');
      fnList.forEach(li => {
        const clone = li.cloneNode(true);
        clone.querySelectorAll('.fn-num-inline, .fn-back').forEach(el => el.remove());
        const text = clone.textContent.trim();
        footnotes.push({ n: footnotes.length + 1, text });
      });
      renumberFootnotes();
      renderFootnotes();

      renderBlocks();
      log('<span class="ok">✓ ' + file.name + ' 불러옴' + (descContent ? '' : ' — 한 줄 설명 없음, 직접 입력') + '</span>');
    }

    // ── HTML 생성 ──
    function esc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function generatePostHTML() {
      const author    = v('meta-author');
      const title     = v('meta-title');
      const bannerSrc = v('banner-src');
      const bannerAlt = v('banner-alt');

      let body = '';
      let textBuf = [];

      function flushText() {
        if (!textBuf.length) return;
        const paras = textBuf.join('\n\n').split(/\n\n+/).filter(p => p.trim());
        body += `\n  <div class="post-content">\n    <div class="post-body">\n`;
        paras.forEach(p => {
          const rawLines = p.trim().split('\n').map(l => l.trim()).join('<br>');
          const lines = normalizeFootnoteReferenceHTML(rawLines);
          body += `      <p>${lines}</p>\n`;
        });
        body += `    </div>\n  </div>\n`;
        textBuf = [];
      }

      blocks.forEach(b => {
        if (b.type === 'text') { if (b.data.text.trim()) textBuf.push(b.data.text); return; }
        if (b.type === 'heading') {
          flushText();
          if (b.data.text.trim()) {
            const indentStyle = b.data.indent ? ` padding-left:${b.data.indent}px;` : '';
            body += `\n  <div class="post-content">\n    <div class="post-body">\n      <p style="font-family: var(--ui-font); font-size: 18px; font-weight: 400; line-height: 1.5; margin-bottom: 1em;${indentStyle}">${esc(b.data.text.trim())}</p>\n    </div>\n  </div>\n`;
          }
          return;
        }
        flushText();
        if (b.type === 'image') {
          const cls = 'post-img-wrap post-img-wrap--' + b.data.size;
          const cap = b.data.caption ? `\n    <figcaption>${esc(b.data.caption)}</figcaption>` : '';
          body += `\n  <figure class="${cls}">\n    <img src="${b.data.src}" alt="${esc(b.data.alt)}" decoding="async" />${cap}\n  </figure>\n`;
        } else if (b.type === 'pair') {
          const c1 = b.data.cap1 ? `\n      <figcaption>${esc(b.data.cap1)}</figcaption>` : '';
          const c2 = b.data.cap2 ? `\n      <figcaption>${esc(b.data.cap2)}</figcaption>` : '';
          body += `\n  <div class="post-img-pair post-img-pair--${b.data.size}">\n    <figure class="post-img-wrap">\n      <img src="${b.data.src1}" alt="${esc(b.data.alt1||'')}" decoding="async" />${c1}\n    </figure>\n    <figure class="post-img-wrap">\n      <img src="${b.data.src2}" alt="${esc(b.data.alt2||'')}" decoding="async" />${c2}\n    </figure>\n  </div>\n`;
        }
      });
      flushText();

      const titleH = author
        ? `<span style="color:#6e6e6e;">${esc(author)}</span><br>${esc(title)}`
        : esc(title);
      const metaDlRows = metaRows
        .filter(r => r.type === 'divider' || r.key.trim() || r.value.trim())
        .map(r => r.type === 'divider'
          ? `        <div style="grid-column:1/-1;border-top:1px dashed var(--rule);margin:7mm 0;"></div>`
          : r.key.trim()
            ? `        <dt>${esc(r.key)}</dt>\n        <dd>${esc(r.value)}</dd>`
            : `        <dd style="grid-column:1/-1">${esc(r.value)}</dd>`)
        .join('\n');
      const banner = bannerSrc
        ? `\n  <figure class="post-banner post-banner--${bannerSize}">\n    <img src="${bannerSrc}" alt="${esc(bannerAlt)}" decoding="async" />\n  </figure>` : '';

      return `<!DOCTYPE html>

  <script id="footnote-nav-script">

      document.querySelectorAll('.post-body sup a[href^="#fn-"], .fn-num-inline a[href^="#fnref-"], .fn-back[href^="#fnref-"]').forEach(function (link) {
        link.addEventListener('click', function (e) {
          const hash = link.getAttribute('href');
          const target = hash ? document.getElementById(hash.slice(1)) : null;
          if (!target) return;
          e.preventDefault();
          target.scrollIntoView({ block: 'center' });
          if (window.history && window.history.pushState) window.history.pushState(null, '', hash);
          else window.location.hash = hash;
        });
      });

  <script id="site-menu-script">
    (function () {
      const NEWSLETTER_URL = 'https://script.google.com/a/macros/yangjari-editions.com/s/AKfycbye3PjtFxT5sqjFrRoWQkpYe0nVOg1dDmFZ_YD1Q7uH6bdsnCPsmkDwTZ6nMQVRkJRIyQ/exec';
      const html = document.documentElement;
      const body = document.body;
      const searchBtn = document.getElementById('search-btn');
      const searchOverlay = document.getElementById('header-search-overlay');
      const searchInput = document.getElementById('search-input');
      const searchClose = document.getElementById('search-close');
      const menuBtn = document.getElementById('menu-btn');
      const menuClose = document.getElementById('menu-close');
      const menuOverlay = document.getElementById('menu-overlay');
      function closeSearch() { if (!searchOverlay || !searchInput) return; searchOverlay.classList.remove('is-open'); searchInput.value = ''; }
      function closeMenu() { html.style.overflow = ''; body.style.overflow = ''; if (menuOverlay) menuOverlay.classList.remove('is-open'); }
      if (searchBtn && searchOverlay && searchInput) {
        searchBtn.addEventListener('click', function () { searchOverlay.classList.add('is-open'); searchInput.focus(); });
        searchInput.addEventListener('keydown', function (e) { if (e.key === 'Enter' && searchInput.value.trim()) window.location.href = '/search/?q=' + encodeURIComponent(searchInput.value.trim()); });
      }
      if (searchClose) searchClose.addEventListener('click', closeSearch);
      if (menuBtn && menuOverlay) menuBtn.addEventListener('click', function () { html.style.overflow = 'hidden'; body.style.overflow = 'hidden'; menuOverlay.classList.add('is-open'); });
      if (menuClose) menuClose.addEventListener('click', closeMenu);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closeSearch(); closeMenu(); }
        if (e.key === 'Enter') {
          const nameEl = document.getElementById('newsletter-name');
          const emailEl = document.getElementById('newsletter-email');
          if (document.activeElement === nameEl) { emailEl.focus(); e.preventDefault(); }
          else if (document.activeElement === emailEl) { window.submitNewsletter(); e.preventDefault(); }
        }
      });
      window.openNewsletter = function () {
        const btn = document.getElementById('menu-newsletter-btn');
        const form = document.getElementById('menu-newsletter-form');
        const name = document.getElementById('newsletter-name');
        if (btn) btn.style.display = 'none';
        if (form) form.style.display = 'flex';
        if (name) name.focus();
      };
      window.submitNewsletter = function () {
        const nameEl = document.getElementById('newsletter-name');
        const emailEl = document.getElementById('newsletter-email');
        const submitBtn = document.getElementById('newsletter-submit');
        const form = document.getElementById('menu-newsletter-form');
        const done = document.getElementById('newsletter-done');
        const name = nameEl ? nameEl.value.trim() : '';
        const email = emailEl ? emailEl.value.trim() : '';
        if (!name || !email || !submitBtn) return;
        submitBtn.textContent = '전송 중...';
        submitBtn.style.pointerEvents = 'none';
        fetch(NEWSLETTER_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ name, email }) }).catch(function () {});
        setTimeout(function () { if (form) form.style.display = 'none'; if (done) done.style.display = 'block'; }, 1000);
      };
    })();
  __CLOSE_SCRIPT__
