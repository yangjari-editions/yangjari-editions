<!DOCTYPE html>
<html lang="ko">
<head>
  <script>document.documentElement.classList.add('fonts-loading');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카탈로그 생성기 — 양자리출판사</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/assets/css/common.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    .gen-topbar {
      height: 52px; display: flex; align-items: center;
      padding: 0 4mm; border-bottom: 1px solid var(--rule);
      font-size: 18px; flex-shrink: 0; gap: 12px;
    }
    .gen-topbar a { color: inherit; text-decoration: none; }
    .gen-topbar .sep { color: var(--rule); }
    .gen-folder-btn {
      padding: 6px 14px; border: 1px solid var(--rule); background: none;
      font-family: var(--ui-font); font-size: 14px;
      color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .gen-folder-btn:hover { background: var(--text); color: white; border-color: var(--text); }
    .gen-folder-btn.ready { border-color: var(--text); background: var(--text); color: white; }
    .gen-folder-status { font-size: 13px; color: var(--rule); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    .gen-layout { display: grid; grid-template-columns: 1fr 400px; flex: 1; min-height: 0; }
    .gen-panel { padding: 28px; overflow-y: auto; border-right: 1px solid var(--rule); }
    .gen-side { padding: 28px; overflow-y: auto; background: #e8e8e8; display: flex; flex-direction: column; gap: 10px; }
    .gen-section { margin-bottom: 32px; }
    .gen-section-title { font-size: 12px; color: var(--rule); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
    .gen-field { margin-bottom: 12px; }
    .gen-label { font-size: 13px; color: var(--rule); margin-bottom: 4px; display: block; }
    .gen-input {
      width: 100%; background: none; border: none; border-bottom: 1px solid var(--rule);
      font-family: var(--ui-font); font-size: 17px; color: var(--text);
      padding: 4px 0; outline: none; letter-spacing: -0.01em;
    }
    .gen-input:focus { border-bottom-color: var(--text); }
    .gen-input-sm {
      width: 100%; background: none; border: none; border-bottom: 1px solid var(--rule);
      font-family: var(--ui-font); font-size: 15px; color: var(--text);
      padding: 3px 0; outline: none; letter-spacing: -0.01em;
    }
    .gen-input-sm:focus { border-bottom-color: var(--text); }
    .gen-textarea {
      width: 100%; background: white; border: 1px solid var(--rule);
      font-family: var(--ui-font); font-size: 15px; color: var(--text);
      padding: 10px; outline: none; letter-spacing: -0.01em;
      resize: vertical; min-height: 80px; line-height: 1.7;
    }
    .gen-textarea.tall { min-height: 160px; }
    .gen-textarea:focus { border-color: var(--text); }
    .gen-img-row { display: flex; gap: 6px; align-items: center; }
    .gen-img-row .gen-input { flex: 1; }
    .gen-img-row .gen-input-sm { flex: 1; }
    .gen-browse-btn {
      flex-shrink: 0; padding: 4px 10px; background: none;
      border: 1px solid var(--rule); font-family: var(--ui-font);
      font-size: 13px; color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .gen-browse-btn:hover { background: var(--text); color: white; border-color: var(--text); }
    .gen-img-preview { width: 80px; height: 54px; object-fit: cover; display: none; margin-top: 8px; }
    .info-rows { display: flex; flex-direction: column; gap: 6px; }
    .info-row { display: grid; grid-template-columns: 110px 1fr auto auto auto; gap: 6px; align-items: center; }
    .gen-btn-sm {
      background: none; border: 1px solid var(--rule); cursor: pointer;
      padding: 2px 8px; font-family: var(--ui-font); font-size: 12px;
      color: var(--text); white-space: nowrap;
    }
    .gen-btn-sm:hover { background: var(--text); color: white; border-color: var(--text); }
    .gen-btn-sm--del:hover { background: #c0392b; border-color: #c0392b; }
    .gen-slider-item { border: 1px solid var(--rule); padding: 14px; background: white; margin-bottom: 8px; }
    .gen-slider-item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .gen-slider-item-label { font-size: 12px; color: var(--rule); letter-spacing: 0.06em; flex: 1; }
    .gen-blocks { display: flex; flex-direction: column; gap: 8px; }
    .gen-block { border: 1px solid var(--rule); padding: 14px; background: white; }
    .gen-block-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .gen-block-type { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rule); flex: 1; }
    .gen-block--heading .gen-block-type { color: #2255aa; }
    .gen-block-actions { display: flex; gap: 4px; }
    .gen-add-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .gen-add-btn {
      padding: 8px 14px; border: 1px dashed var(--rule); background: none;
      font-family: var(--ui-font); font-size: 14px; color: var(--rule); cursor: pointer;
    }
    .gen-add-btn:hover { border-color: var(--text); color: var(--text); background: white; }
    .gen-save-btn {
      width: 100%; padding: 13px; background: var(--text); color: white;
      border: none; font-family: var(--ui-font); font-size: 17px;
      cursor: pointer; letter-spacing: -0.01em;
    }
    .gen-save-btn:hover { opacity: 0.75; }
    .gen-save-btn:disabled { opacity: 0.35; cursor: default; }
    .gen-generate-btn {
      width: 100%; padding: 10px; background: none; border: 1px solid var(--text);
      font-family: var(--ui-font); font-size: 15px; cursor: pointer;
      color: var(--text); letter-spacing: -0.01em;
    }
    .gen-generate-btn:hover { background: var(--text); color: white; }
    .gen-copy-btn {
      width: 100%; padding: 10px; background: none; border: 1px solid var(--rule);
      font-family: var(--ui-font); font-size: 14px; cursor: pointer;
      color: var(--rule); letter-spacing: -0.01em;
    }
    .gen-copy-btn:hover { background: var(--rule); color: white; }
    .gen-log { font-size: 13px; line-height: 1.8; color: var(--rule); padding: 10px; background: #d8d8d8; min-height: 60px; }
    .gen-log .ok { color: #2d7a2d; }
    .gen-log .err { color: #c0392b; }
    .gen-code {
      flex: 1; min-height: 200px; width: 100%; background: #1c1c1c; color: #d4d4d4;
      border: none; font-family: 'Courier New', monospace; font-size: 11.5px;
      padding: 12px; resize: none; outline: none; line-height: 1.55;
    }
    .gen-divider { border: none; border-top: 1px solid var(--rule); margin: 0; }
    @media (max-width: 820px) { .gen-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="gen-topbar">
    <a href="/">양자리출판사</a>
    <span class="sep">/</span>
    <span>카탈로그 생성기</span>
    <span class="gen-folder-status" id="folder-status">폴더 미선택</span>
    <button class="gen-folder-btn" style="margin-left:auto;" onclick="loadCatalog()">불러오기</button>
    <button class="gen-folder-btn" id="folder-btn" style="margin-left:0;" onclick="selectFolder()">프로젝트 폴더 선택</button>
  </div>

  <div class="gen-layout">
    <div class="gen-panel">

      <div class="gen-section">
        <div class="gen-section-title">메타데이터</div>
        <div class="gen-field">
          <label class="gen-label">파일명 (catalog/ 에 저장)</label>
          <input class="gen-input" id="meta-filename" type="text" placeholder="c_002_beckett.html" />
        </div>
        <div class="gen-field">
          <label class="gen-label">저자 (선택 — 회색으로 표시)</label>
          <input class="gen-input" id="meta-author" type="text" placeholder="사뮈엘 베케트" />
        </div>
        <div class="gen-field">
          <label class="gen-label">제목</label>
          <input class="gen-input" id="meta-title" type="text" placeholder="고도를 기다리며" />
        </div>
      </div>

      <div class="gen-section">
        <div class="gen-section-title">카탈로그 카드 이미지</div>
        <div class="gen-field">
          <label class="gen-label">앞표지 (루트 기준)</label>
          <div class="gen-img-row">
            <input class="gen-input" id="card-front" type="text" placeholder="images/catalog/c_002_front.webp" />
            <button class="gen-browse-btn" onclick="pickImage('card-front','card-front-preview',true)">찾아보기</button>
          </div>
          <img class="gen-img-preview" id="card-front-preview" />
        </div>
        <div class="gen-field">
          <label class="gen-label">뒤표지 (루트 기준)</label>
          <div class="gen-img-row">
            <input class="gen-input" id="card-back" type="text" placeholder="images/catalog/c_002_back.webp" />
            <button class="gen-browse-btn" onclick="pickImage('card-back','card-back-preview',true)">찾아보기</button>
          </div>
          <img class="gen-img-preview" id="card-back-preview" />
        </div>
      </div>

      <div class="gen-section">
        <div class="gen-section-title">슬라이더 이미지</div>
        <div class="gen-slider-list" id="slider-list"></div>
        <button class="gen-add-btn" onclick="addSlide()">+ 슬라이드 추가</button>
      </div>

      <div class="gen-section">
        <div class="gen-section-title">도서 정보 (항목명 / 내용 직접 수정·추가·삭제 가능)</div>
        <div class="info-rows" id="info-rows"></div>
        <button class="gen-add-btn" style="margin-top:10px;" onclick="addInfoRow()">+ 항목 추가</button>
      </div>

      <div class="gen-section">
        <div class="gen-section-title">본문</div>
        <div class="gen-blocks" id="blocks-container"></div>
        <div class="gen-add-btns">
          <button class="gen-add-btn" onclick="addBlock('body')">+ 본문 (을유)</button>
          <button class="gen-add-btn" onclick="addBlock('heading')">+ 소제목 (GothicA1)</button>
        </div>
      </div>

    </div>

    <div class="gen-side">
      <button class="gen-save-btn" onclick="saveAll()">저장하기</button>
      <hr class="gen-divider">
      <button class="gen-generate-btn" onclick="previewGenerate()">HTML만 미리보기</button>
      <button class="gen-copy-btn" id="copy-btn" onclick="copyCode()">복사</button>
      <div class="gen-log" id="gen-log">폴더를 선택하면 저장하기 버튼으로<br>파일이 자동 생성·업데이트됩니다.</div>
      <textarea class="gen-code" id="output-code" readonly placeholder="'HTML만 미리보기' 버튼을 누르면 여기에 코드가 나옵니다."></textarea>
    </div>
  </div>

  <script>
    let slides = [], nextSlideId = 0;
    let infoRows = [], nextInfoId = 0;
    let blocks = [], nextBlockId = 0;
    let dirHandle = null;

    function log(msg) { document.getElementById('gen-log').innerHTML = msg; }
    function v(id) { return document.getElementById(id).value.trim(); }
    function slugFromFilename(filename) { return (filename || '').replace(/\.html$/i, '').trim(); }
    function sourceFilenameFromDoc(doc, fallback) {
      const meta = doc.querySelector('meta[name="source-filename"]');
      return meta && meta.content ? meta.content.trim() : fallback;
    }
    function toPreviewURL(path) {
      const value = (path || '').trim();
      if (!value) return '';
      if (/^(blob:|data:|https?:|file:)/i.test(value)) return value;
      if (value.startsWith('/') || value.startsWith('../') || value.startsWith('./')) return value;
      if (value.startsWith('images/')) return '../' + value;
      return value;
    }
    function syncPreviewFromInput(inputId, previewId) {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);
      if (!input || !preview) return;
      const url = toPreviewURL(input.value);
      preview.src = url;
      preview.style.display = url ? 'block' : 'none';
    }
    function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    const DEFAULT_LABELS = ['번역','편집','디자인','판형','제본','페이지수','가격','ISBN'];

    // ── 폴더 ──
    async function selectFolder() {
      try {
        dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        document.getElementById('folder-status').textContent = dirHandle.name;
        document.getElementById('folder-btn').classList.add('ready');
        document.getElementById('folder-btn').textContent = '폴더 변경';
        log('📁 ' + dirHandle.name + ' 선택됨');
      } catch(e) { if (e.name !== 'AbortError') log('<span class="err">폴더 선택 실패: ' + e.message + '</span>'); }
    }

    // ── 도서 정보 ──
    function addInfoRow(label, value) {
      const id = nextInfoId++;
      infoRows.push({ id, label: label||'', value: value||'' });
      renderInfoRows();
    }
    function removeInfoRow(id) { infoRows = infoRows.filter(r => r.id !== id); renderInfoRows(); }
    function moveInfoRow(id, dir) {
      const i = infoRows.findIndex(r => r.id === id), j = i + dir;
      if (j < 0 || j >= infoRows.length) return;
      [infoRows[i], infoRows[j]] = [infoRows[j], infoRows[i]]; renderInfoRows();
    }
    function syncInfo(id, key, el) { const r = infoRows.find(r => r.id === id); if (r) r[key] = el.value; }
    function renderInfoRows() {
      const c = document.getElementById('info-rows'); c.innerHTML = '';
      infoRows.forEach(r => {
        const d = document.createElement('div'); d.className = 'info-row';
        d.innerHTML =
          '<input class="gen-input-sm" value="' + esc(r.label) + '" placeholder="항목명" oninput="syncInfo(' + r.id + ',\'label\',this)" />' +
          '<input class="gen-input-sm" value="' + esc(r.value) + '" placeholder="내용" oninput="syncInfo(' + r.id + ',\'value\',this)" />' +
          '<button class="gen-btn-sm" onclick="moveInfoRow(' + r.id + ',-1)">↑</button>' +
          '<button class="gen-btn-sm" onclick="moveInfoRow(' + r.id + ',1)">↓</button>' +
          '<button class="gen-btn-sm gen-btn-sm--del" onclick="removeInfoRow(' + r.id + ')">삭제</button>';
        c.appendChild(d);
      });
    }

    // ── 본문 블록 ──
    function addBlock(type, text, indent, weight) {
      const id = nextBlockId++;
      blocks.push({ id, type, text: text||'', indent: indent||'', weight: type === 'heading' ? (weight || '400') : '' }); renderBlocks();
    }
    function removeBlock(id) { blocks = blocks.filter(b => b.id !== id); renderBlocks(); }
    function moveBlock(id, dir) {
      const i = blocks.findIndex(b => b.id === id), j = i + dir;
      if (j < 0 || j >= blocks.length) return;
      [blocks[i], blocks[j]] = [blocks[j], blocks[i]]; renderBlocks();
    }
    function syncBlock(id, el) { const b = blocks.find(b => b.id === id); if (b) b.text = el.value; autoResize(el); }
    function syncIndent(id, el) { const b = blocks.find(b => b.id === id); if (b) b.indent = el.value; }
    function setHeadingWeight(id, weight) {
      const b = blocks.find(b => b.id === id);
      if (b) b.weight = weight;
      renderBlocks();
    }
    function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
    function renderBlocks() {
      const c = document.getElementById('blocks-container'); c.innerHTML = '';
      blocks.forEach(b => {
        const d = document.createElement('div');
        d.className = 'gen-block gen-block--' + b.type;
        const label = b.type === 'body' ? '본문 (을유)' : '소제목 (GothicA1)';
        const ph = b.type === 'body' ? '본문 텍스트. 빈 줄로 문단을 나눕니다.' : '소제목을 입력하세요.';
        const headingOptions = b.type === 'heading'
          ? '<div style="display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;">' +
              '<div style="display:flex;align-items:center;gap:6px;"><label style="font-size:13px;color:var(--rule);white-space:nowrap;">들여쓰기 (px)</label><input type="number" min="0" style="width:70px;background:none;border:none;border-bottom:1px solid var(--rule);font-family:var(--ui-font);font-size:14px;padding:2px 0;outline:none;" value="' + (b.indent||'') + '" placeholder="0" oninput="syncIndent(' + b.id + ',this)" /></div>' +
              '<div style="display:flex;align-items:center;gap:6px;"><label style="font-size:13px;color:var(--rule);white-space:nowrap;">weight</label>' +
                '<button class="gen-btn-sm" style="' + ((b.weight||'400') === '400' ? 'background:var(--text);color:white;border-color:var(--text);' : '') + '" onclick="setHeadingWeight(' + b.id + ',\'400\')">400</button>' +
                '<button class="gen-btn-sm" style="' + ((b.weight||'400') === '500' ? 'background:var(--text);color:white;border-color:var(--text);' : '') + '" onclick="setHeadingWeight(' + b.id + ',\'500\')">500</button>' +
                '<button class="gen-btn-sm" style="' + ((b.weight||'400') === '600' ? 'background:var(--text);color:white;border-color:var(--text);' : '') + '" onclick="setHeadingWeight(' + b.id + ',\'600\')">600</button>' +
              '</div>' +
            '</div>'
          : '';
        d.innerHTML =
          '<div class="gen-block-header">' +
            '<span class="gen-block-type">' + label + '</span>' +
            '<div class="gen-block-actions">' +
              '<button class="gen-btn-sm" onclick="moveBlock(' + b.id + ',-1)">↑</button>' +
              '<button class="gen-btn-sm" onclick="moveBlock(' + b.id + ',1)">↓</button>' +
              '<button class="gen-btn-sm gen-btn-sm--del" onclick="removeBlock(' + b.id + ')">삭제</button>' +
            '</div></div>' +
          '<textarea class="gen-textarea' + (b.type === 'body' ? ' tall' : '') + '" ' +
            'placeholder="' + ph + '" oninput="syncBlock(' + b.id + ',this)" onmouseup="autoResize(this)">' + esc(b.text) + '</textarea>' +
          headingOptions;
        c.appendChild(d);
      });
      requestAnimationFrame(() => {
        c.querySelectorAll('textarea.tall').forEach(el => autoResize(el));
      });
    }

    // ── 슬라이더 ──
    function addSlide(src, alt) {
      const id = nextSlideId++;
      slides.push({ id, src: src||'', alt: alt||'', preview: '' }); renderSlides();
    }
    function removeSlide(id) { slides = slides.filter(s => s.id !== id); renderSlides(); }
    function moveSlide(id, dir) {
      const i = slides.findIndex(s => s.id === id), j = i + dir;
      if (j < 0 || j >= slides.length) return;
      [slides[i], slides[j]] = [slides[j], slides[i]]; renderSlides();
    }
    function syncSlide(id, key, el) { const s = slides.find(s => s.id === id); if (s) s[key] = el.value; }
    function renderSlides() {
      const c = document.getElementById('slider-list'); c.innerHTML = '';
      slides.forEach((s, idx) => {
        const d = document.createElement('div'); d.className = 'gen-slider-item';
        const ps = s.preview ? 'display:block;' : 'display:none;';
        d.innerHTML =
          '<div class="gen-slider-item-header">' +
            '<span class="gen-slider-item-label">슬라이드 ' + (idx+1) + '</span>' +
            '<button class="gen-btn-sm" onclick="moveSlide(' + s.id + ',-1)">↑</button>' +
            '<button class="gen-btn-sm" onclick="moveSlide(' + s.id + ',1)">↓</button>' +
            '<button class="gen-btn-sm gen-btn-sm--del" onclick="removeSlide(' + s.id + ')">삭제</button>' +
          '</div>' +
          '<div class="gen-field"><label class="gen-label">이미지 (catalog/ 기준)</label>' +
            '<div class="gen-img-row">' +
              '<input class="gen-input-sm" id="slide-src-' + s.id + '" value="' + esc(s.src) + '" placeholder="../images/catalog/c_002_01.webp" oninput="syncSlide(' + s.id + ',\'src\',this)" />' +
              '<button class="gen-browse-btn" onclick="pickSlideImage(' + s.id + ')">찾아보기</button>' +
            '</div>' +
            '<img class="gen-img-preview" id="slide-prev-' + s.id + '" style="' + ps + '" src="' + esc(s.preview) + '" />' +
          '</div>' +
          '<div class="gen-field"><label class="gen-label">alt 텍스트 (선택)</label>' +
            '<input class="gen-input-sm" value="' + esc(s.alt) + '" placeholder="표지 이미지" oninput="syncSlide(' + s.id + ',\'alt\',this)" />' +
          '</div>';
        c.appendChild(d);
      });
    }

    // ── 파일 피커 ──
    const _fi = document.createElement('input');
    _fi.type = 'file'; _fi.accept = 'image/*'; _fi.style.display = 'none';
    document.body.appendChild(_fi);
    let _cb = null;
    _fi.addEventListener('change', () => { if (_fi.files[0] && _cb) _cb(_fi.files[0]); _fi.value = ''; _cb = null; });

    async function copyImg(file, isRoot) {
      if (!dirHandle) return null;
      try {
        const imgDir = await dirHandle.getDirectoryHandle('images', { create: true });
        const catDir = await imgDir.getDirectoryHandle('catalog', { create: true });
        const fh = await catDir.getFileHandle(file.name, { create: true });
        const w = await fh.createWritable();
        await w.write(await file.arrayBuffer());
        await w.close();
        return isRoot ? 'images/catalog/' + file.name : '../images/catalog/' + file.name;
      } catch(e) { log('<span class="err">이미지 복사 실패: ' + e.message + '</span>'); return null; }
    }

    function pickImage(inputId, previewId, isRoot) {
      _cb = async (file) => {
        const url = URL.createObjectURL(file);
        const prev = document.getElementById(previewId);
        if (prev) { prev.src = url; prev.style.display = 'block'; }
        const input = document.getElementById(inputId);
        if (input && dirHandle) { const p = await copyImg(file, isRoot); if (p) input.value = p; }

    async function loadCatalog() {
      let file;
      try {
        const [fh] = await window.showOpenFilePicker({ types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }] });
        file = await fh.getFile();
      } catch(e) { if (e.name !== 'AbortError') log('<span class="err">불러오기 실패: ' + e.message + '</span>'); return; }

      const doc = new DOMParser().parseFromString(await file.text(), 'text/html');
      const sourceFilename = sourceFilenameFromDoc(doc, file.name === 'index.html' ? '' : file.name) || file.name;
      document.getElementById('meta-filename').value = sourceFilename;

          clone.querySelectorAll('span,br').forEach(n => n.remove());
          document.getElementById('meta-title').value = clone.textContent.trim();
        } else {
          document.getElementById('meta-author').value = '';

      // 도서 정보
      infoRows = []; nextInfoId = 0;

        const dd = dt.nextElementSibling;

      });
      if (infoRows.length === 0) DEFAULT_LABELS.forEach(l => addInfoRow(l, ''));

      // 슬라이더
      slides = []; nextSlideId = 0;
      doc.querySelectorAll('.product-slide img').forEach(img =>
        slides.push({ id: nextSlideId++, src: img.getAttribute('src')||'', alt: img.getAttribute('alt')||'', preview: '' })
      );
      renderSlides();

      // 본문 블록
      blocks = []; nextBlockId = 0;
      const copyEl = doc.querySelector('.product-copy');
      if (copyEl) {
        const bodyParas = [];
        copyEl.querySelectorAll('p').forEach(p => {
          const style = p.getAttribute('style') || '';
          const isHeading = style.includes('GothicA1') || style.includes('ui-font');
          if (isHeading) {
            if (bodyParas.length) { addBlock('body', bodyParas.join('\n\n')); bodyParas.length = 0; }
            const plMatch = style.match(/padding-left:\s*([\d.]+)px/);
            const fwMatch = style.match(/font-weight:\s*(400|500|600)/);
            addBlock('heading', p.textContent.trim(), plMatch ? plMatch[1] : '', fwMatch ? fwMatch[1] : '400');

            if (t) bodyParas.push(t);

        if (bodyParas.length) addBlock('body', bodyParas.join('\n\n'));
      }
      if (blocks.length === 0) addBlock('body');

      // 카드 이미지 초기화
      ['card-front','card-back'].forEach(id => {

        await updateCatalogDataJS();
        log('<span class="ok">✓ catalog-data.js 업데이트됨 🎉</span>');
      } catch(e) { log('<span class="err">오류: ' + e.message + '</span>'); console.error(e); }
    }

    async function updateCatalogDataJS() {
      const fh = await (await dirHandle.getDirectoryHandle('data', { create: true })).getFileHandle('catalog-data.js');
      const file = await fh.getFile();
      const content = await file.text();

      const filename = v('meta-filename');
      const title    = v('meta-title');
      const author   = v('meta-author');
      const front    = v('card-front');
      const back     = v('card-back');
      const href     = '/catalog/' + slugFromFilename(filename) + '/';
      const titleStr = author ? author + '<br>' + title : title;

      const match = content.match(/const CATALOG_POSTS\s*=\s*\[([\s\S]*?)\];/);
      let posts = [];
      if (match) {
        try { posts = eval('[' + match[1] + ']'); } catch(e) { posts = []; }
      }

      const newPost = { href, imgFront: front, imgBack: back || null, title: titleStr };
      const existing = posts.findIndex(p => p.href === href);
      if (existing >= 0) posts[existing] = newPost;
      else posts.unshift(newPost);

      const postsStr = posts.map(p =>
        `  {\n    href:     "${p.href}",\n    imgFront: "${p.imgFront}",\n    imgBack:  ${p.imgBack ? '"' + p.imgBack + '"' : 'null'},\n    title:    "${(p.title||'').replace(/"/g,'\\"')}"\n  }`
      ).join(',\n');

      const newContent = content.replace(
        /const CATALOG_POSTS\s*=\s*\[\s*[\s\S]*?\];/,
        `const CATALOG_POSTS = [\n${postsStr}\n];`
      );

      const w = await fh.createWritable();
      await w.write(newContent);
      await w.close();
    }

    function generateCardHTML() {
      const pf = v('meta-filename'), title = v('meta-title'), author = v('meta-author');
      const front = v('card-front'), back = v('card-back');
      const tl = author ? '<span style="color:#6e6e6e;">' + esc(author) + '</span><br>' + esc(title) : esc(title);
      return '\n      <div class="catalog-card">\n        <a href="/catalog/' + esc(slugFromFilename(pf)) + '/" class="catalog-book-link">\n          <div class="catalog-book">\n            <div class="catalog-book-front" style="background-image:url(\'' + esc(front) + '\');background-size:cover;background-position:center;"></div>\n            <div class="catalog-book-back" style="background-image:url(\'' + esc(back) + '\');background-size:cover;background-position:center;opacity:0;"></div>\n          </div>\n        </a>\n        <a href="/catalog/' + esc(slugFromFilename(pf)) + '/" class="catalog-title">' + tl + '</a>\n      </div>';
    }

    function previewGenerate() { document.getElementById('output-code').value = generateCatalogHTML(); }
    function copyCode() {
      const ta = document.getElementById('output-code');
      if (!ta.value) return;
      navigator.clipboard.writeText(ta.value).catch(() => { ta.select(); document.execCommand('copy'); });
      const btn = document.getElementById('copy-btn'); btn.textContent = '복사됨 ✓';
      setTimeout(() => btn.textContent = '복사', 2000);
    }

    document.getElementById('card-front').addEventListener('input', () => syncPreviewFromInput('card-front', 'card-front-preview'));
    document.getElementById('card-back').addEventListener('input', () => syncPreviewFromInput('card-back', 'card-back-preview'));

    // 기본값
    DEFAULT_LABELS.forEach(l => addInfoRow(l, ''));
    addSlide();
    addBlock('body');
  </script>

  <script>
    (function () {
      const html = document.documentElement; let revealed = false;
      function reveal() { if (revealed) return; revealed = true; html.classList.remove('fonts-loading'); html.classList.add('fonts-ready'); }
      const t = setTimeout(reveal, 3000);
      Promise.all([document.fonts.load('400 1em "GothicA1"'), document.fonts.ready]).then(() => { clearTimeout(t); requestAnimationFrame(reveal); }).catch(() => { clearTimeout(t); reveal(); });
    })();
  </script>
