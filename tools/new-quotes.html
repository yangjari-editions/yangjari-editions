<!DOCTYPE html>
<html lang="ko">
<head>
  <script>document.documentElement.classList.add('fonts-loading');</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인용문 관리 — 양자리출판사</title>
  <link rel="stylesheet" href="/assets/css/common.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100dvh; }

    .gen-topbar {
      height: 52px; display: flex; align-items: center;
      padding: 0 4mm; border-bottom: 1px solid var(--rule);
      font-size: 18px; flex-shrink: 0; gap: 12px;
    }
    .gen-topbar a { color: inherit; text-decoration: none; }
    .gen-topbar .sep { color: var(--rule); }

    .gen-folder-btn {
      margin-left: auto; padding: 6px 14px;
      border: 1px solid var(--rule); background: none;
      font-family: var(--ui-font); font-size: 14px;
      color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .gen-folder-btn:hover { background: var(--text); color: white; border-color: var(--text); }
    .gen-folder-btn.ready { border-color: var(--text); background: var(--text); color: white; }
    .gen-folder-status { font-size: 13px; color: var(--rule); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    .gen-layout {
      display: grid; grid-template-columns: 1fr 400px;
      flex: 1; min-height: 0;
    }

    .gen-panel { padding: 28px; overflow-y: auto; border-right: 1px solid var(--rule); }
    .gen-side { padding: 28px; overflow-y: auto; background: #e8e8e8; display: flex; flex-direction: column; gap: 10px; }

    .gen-section { margin-bottom: 32px; }
    .gen-section-title { font-size: 12px; color: var(--rule); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }

    .gen-field { margin-bottom: 12px; }
    .gen-label { font-size: 13px; color: var(--rule); margin-bottom: 4px; display: block; }

    .gen-input {
      width: 100%; background: none; border: none;
      border-bottom: 1px solid var(--rule);
      font-family: var(--ui-font); font-size: 17px;
      color: var(--text); padding: 4px 0; outline: none; letter-spacing: -0.01em;
    }
    .gen-input:focus { border-bottom-color: var(--text); }

    .gen-textarea {
      width: 100%; background: white; border: 1px solid var(--rule);
      font-family: var(--ui-font); font-size: 15px; color: var(--text);
      padding: 10px; outline: none; letter-spacing: -0.01em;
      resize: vertical; min-height: 80px; line-height: 1.7;
    }
    .gen-textarea:focus { border-color: var(--text); }

    /* 인용문 목록 */
    .quote-list { display: flex; flex-direction: column; gap: 8px; }

    .quote-item {
      border: 1px solid var(--rule);
      padding: 14px;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .quote-item-header {
      display: flex; align-items: flex-start; gap: 8px;
    }

    .quote-item-text {
      flex: 1; font-size: 15px; line-height: 1.6;
    }

    .quote-item-source {
      font-size: 13px; color: var(--rule);
    }

    .quote-item-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .gen-btn-sm {
      background: none; border: 1px solid var(--rule);
      cursor: pointer; padding: 2px 8px;
      font-family: var(--ui-font); font-size: 12px; color: var(--text);
    }
    .gen-btn-sm:hover { background: var(--text); color: white; border-color: var(--text); }
    .gen-btn-sm--del:hover { background: #c0392b; border-color: #c0392b; }

    /* 추가 폼 */
    .add-form {
      border: 1px dashed var(--rule);
      padding: 18px;
      background: white;
      margin-top: 16px;
    }

    .gen-add-btn {
      padding: 8px 14px; border: 1px dashed var(--rule);
      background: none; font-family: var(--ui-font);
      font-size: 14px; color: var(--rule); cursor: pointer;
      margin-top: 14px;
    }
    .gen-add-btn:hover { border-color: var(--text); color: var(--text); background: white; }

    /* 버튼 */
    .gen-save-btn {
      width: 100%; padding: 13px; background: var(--text);
      color: white; border: none; font-family: var(--ui-font);
      font-size: 17px; cursor: pointer; letter-spacing: -0.01em;
    }
    .gen-save-btn:hover { opacity: 0.75; }
    .gen-save-btn:disabled { opacity: 0.35; cursor: default; }

    .gen-divider { border: none; border-top: 1px solid var(--rule); margin: 0; }

    .gen-log {
      font-size: 13px; line-height: 1.8; color: var(--rule);
      padding: 10px; background: #d8d8d8; min-height: 60px;
    }
    .gen-log .ok { color: #2d7a2d; }
    .gen-log .err { color: #c0392b; }

    /* 미리보기 */
    .preview-box {
      background: var(--bg);
      border: 1px solid var(--rule);
      padding: 18px 12px;
      text-align: center;
      font-size: 18px;
      line-height: 1.5;
    }
    .preview-line { display: block; }
    .preview-source { display: block; margin-top: 2px; font-size: 15px; color: var(--rule); }

    @media (max-width: 820px) {
      .gen-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="gen-topbar">
    <a href="/">양자리출판사</a>
    <span class="sep">/</span>
    <span>인용문 관리</span>
    <span class="gen-folder-status" id="folder-status">폴더 미선택</span>
    <button class="gen-folder-btn" id="folder-btn" onclick="selectFolder()">프로젝트 폴더 선택</button>
  </div>

  <div class="gen-layout">

    <!-- 왼쪽: 인용문 목록 -->
    <div class="gen-panel">

      <div class="gen-section">
        <div class="gen-section-title">인용문 목록 (<span id="quote-count">0</span>개)</div>
        <div class="quote-list" id="quote-list"></div>

        <button class="gen-add-btn" onclick="showAddForm()">+ 인용문 추가</button>

        <!-- 추가/수정 폼 -->
        <div class="add-form" id="add-form" style="display:none;">
          <div class="gen-section-title" id="form-title">새 인용문</div>
          <div class="gen-field">
            <label class="gen-label">인용문</label>
            <textarea class="gen-textarea" id="input-line" placeholder="내 영혼은 지치고, 허약하고, 슬프다."></textarea>
          </div>
          <div class="gen-field">
            <label class="gen-label">저자명</label>
            <input class="gen-input" id="input-source" type="text" placeholder="조리스카를 위스망스(Joris-Karl Huysmans, 1848–1907)" />
          </div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="gen-btn-sm" onclick="submitForm()" style="padding:6px 14px;font-size:14px;">저장</button>
            <button class="gen-btn-sm" onclick="cancelForm()" style="padding:6px 14px;font-size:14px;">취소</button>
          </div>
        </div>
      </div>

    </div>

    <!-- 오른쪽: 저장 + 미리보기 -->
    <div class="gen-side">
      <button class="gen-save-btn" id="save-btn" onclick="saveFile()" disabled>저장하기</button>
      <hr class="gen-divider">
      <div class="gen-section-title" style="margin-bottom:8px;">미리보기 (랜덤)</div>
      <div class="preview-box" id="preview-box">
        <span class="preview-line" style="color:var(--rule);">인용문을 추가하면<br>여기에 미리보기가 나타납니다.</span>
      </div>
      <button class="gen-btn-sm" onclick="updatePreview()" style="padding:6px 14px;font-size:13px;width:100%;">미리보기 새로고침</button>
      <hr class="gen-divider">
      <div class="gen-log" id="gen-log">폴더를 선택하면 저장하기 버튼으로<br>quotes-data.js가 업데이트됩니다.</div>
    </div>

  </div>

  <script>
    let quotes = [];
    let editIndex = -1;
    let dirHandle = null;

    function log(msg) { document.getElementById('gen-log').innerHTML = msg; }

    // ── 폴더 선택 ──
    async function selectFolder() {
      try {
        dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
        document.getElementById('folder-status').textContent = dirHandle.name;
        document.getElementById('folder-btn').classList.add('ready');
        document.getElementById('folder-btn').textContent = '폴더 변경';
        log('📁 ' + dirHandle.name + ' 선택됨');
        document.getElementById('save-btn').disabled = false;
        // 기존 quotes-data.js 불러오기
        await loadQuotesData();
      } catch(e) {
        if (e.name !== 'AbortError') log('<span class="err">폴더 선택 실패: ' + e.message + '</span>');
      }
    }

    // ── 기존 quotes-data.js 불러오기 ──
    async function loadQuotesData() {
      try {
        const fh = await (await dirHandle.getDirectoryHandle('data', { create: true })).getFileHandle('quotes-data.js');
        const file = await fh.getFile();
        const content = await file.text();
        const match = content.match(/const QUOTES\s*=\s*\[([\s\S]*?)\];/);
        if (match) {
          try {
            quotes = eval('[' + match[1] + ']');
          } catch(e) { quotes = []; }
        }
        renderList();
        updatePreview();
        log('<span class="ok">✓ quotes-data.js 불러옴 (' + quotes.length + '개)</span>');
      } catch(e) {
        // 파일 없으면 기본값으로 시작
        quotes = [
          { line: "내 영혼은 지치고, 허약하고, 슬프다.", source: "조리스카를 위스망스(Joris-Karl Huysmans, 1848–1907)" },
          { line: "잔혹극은 피가 아니라 잔혹성 그 자체다.", source: "앙토냉 아르토(Antonin Artaud, 1896–1948)" },
          { line: "나는 내 고통의 지도를 그린다.", source: "앙토냉 아르토(Antonin Artaud, 1896–1948)" },
          { line: "우리는 모두 미쳐서 태어난다. 그리고 끝내 그렇게 남는 자들도 있다.", source: "사뮈엘 베케트(Samuel Beckett, 1906–1989)" }
        ];
        renderList();
        updatePreview();
        log('quotes-data.js 없음 — 기본값으로 시작합니다.');
      }
    }

    // ── 목록 렌더링 ──
    function renderList() {
      const list = document.getElementById('quote-list');
      document.getElementById('quote-count').textContent = quotes.length;

      if (quotes.length === 0) {
        list.innerHTML = '<div style="font-size:14px;color:var(--rule);padding:12px 0;">인용문이 없습니다.</div>';
        return;
      }

      list.innerHTML = quotes.map((q, i) => `
        <div class="quote-item">
          <div class="quote-item-header">
            <div class="quote-item-text">
              <div>${esc(q.line)}</div>
              <div class="quote-item-source">${esc(q.source)}</div>
            </div>
            <div class="quote-item-actions">
              <button class="gen-btn-sm" onclick="moveUp(${i})">↑</button>
              <button class="gen-btn-sm" onclick="moveDown(${i})">↓</button>
              <button class="gen-btn-sm" onclick="editItem(${i})">수정</button>
              <button class="gen-btn-sm gen-btn-sm--del" onclick="deleteItem(${i})">삭제</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function esc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── 추가/수정 폼 ──
    function showAddForm() {
      editIndex = -1;
      document.getElementById('form-title').textContent = '새 인용문';
      document.getElementById('input-line').value = '';
      document.getElementById('input-source').value = '';
      document.getElementById('add-form').style.display = 'block';
      document.getElementById('input-line').focus();
    }

    function editItem(i) {
      editIndex = i;
      document.getElementById('form-title').textContent = '인용문 수정';
      document.getElementById('input-line').value = quotes[i].line;
      document.getElementById('input-source').value = quotes[i].source;
      document.getElementById('add-form').style.display = 'block';
      document.getElementById('input-line').focus();
    }

    function cancelForm() {
      editIndex = -1;
      document.getElementById('add-form').style.display = 'none';
    }

    function submitForm() {
      const line = document.getElementById('input-line').value.trim();
      const source = document.getElementById('input-source').value.trim();
      if (!line) { alert('인용문을 입력해주세요.'); return; }

      if (editIndex >= 0) {
        quotes[editIndex] = { line, source };
      } else {
        quotes.push({ line, source });
      }

      cancelForm();
      renderList();
      updatePreview();
    }

    function deleteItem(i) {
      if (!confirm('이 인용문을 삭제할까요?')) return;
      quotes.splice(i, 1);
      renderList();
      updatePreview();
    }

    function moveUp(i) {
      if (i === 0) return;
      [quotes[i-1], quotes[i]] = [quotes[i], quotes[i-1]];
      renderList();
    }

    function moveDown(i) {
      if (i === quotes.length - 1) return;
      [quotes[i], quotes[i+1]] = [quotes[i+1], quotes[i]];
      renderList();
    }

    // ── 미리보기 ──
    function updatePreview() {
      const box = document.getElementById('preview-box');
      if (quotes.length === 0) {
        box.innerHTML = '<span class="preview-line" style="color:var(--rule);">인용문이 없습니다.</span>';
        return;
      }
      const q = quotes[Math.floor(Math.random() * quotes.length)];
      box.innerHTML =
        '<span class="preview-line">' + esc(q.line) + '</span>' +
        (q.source ? '<span class="preview-source">' + esc(q.source) + '</span>' : '');
    }

    // ── 저장 ──
    async function saveFile() {
      if (!dirHandle) { log('<span class="err">먼저 프로젝트 폴더를 선택해주세요.</span>'); return; }

      const postsStr = quotes.map(q =>
        `  { line: "${q.line.replace(/"/g, '\\"')}", source: "${(q.source||'').replace(/"/g, '\\"')}" }`
      ).join(',\n');

      const content =
`// ── 인용문 데이터 ──
// 페이지 로드 시 랜덤으로 하나가 표시됩니다.
// 인용문 관리 생성기(생성기/new-quotes.html)에서 관리하세요.

const QUOTES = [
${postsStr}
];
`;

      try {
        const fh = await (await dirHandle.getDirectoryHandle('data', { create: true })).getFileHandle('quotes-data.js', { create: true });
        const w = await fh.createWritable();
        await w.write(content);
        await w.close();
        log('<span class="ok">✓ quotes-data.js 저장 완료 (' + quotes.length + '개)</span>');
      } catch(e) {
        log('<span class="err">오류: ' + e.message + '</span>');
      }
    }
  </script>

  <script>
    (function () {
      const html = document.documentElement; let revealed = false;
      function reveal() { if (revealed) return; revealed = true; html.classList.remove('fonts-loading'); html.classList.add('fonts-ready'); }
      const t = setTimeout(reveal, 3000);
      Promise.all([document.fonts.load('400 1em "GothicA1"'), document.fonts.ready])
        .then(() => { clearTimeout(t); requestAnimationFrame(reveal); }).catch(() => { clearTimeout(t); reveal(); });
    })();
  </script>

</body>
</html>
